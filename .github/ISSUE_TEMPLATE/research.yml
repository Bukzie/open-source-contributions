name: Research lead
description: Record a possible opportunity to evaluate
labels: ["research"]
body:
  - type: input
    id: upstream
    attributes:
      label: Upstream link
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it might be worth validating
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Known risks (competing PRs, AI policy, maintainer activity), with the date observed
